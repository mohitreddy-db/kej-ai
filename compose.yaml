services:
  postgres:
    image: postgres:16-alpine
    container_name: kejai-postgres
    environment:
      POSTGRES_DB: kejai
      POSTGRES_USER: kejai
      POSTGRES_PASSWORD: kejai_local
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kejai -d kejai"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kejai_postgres_data:/var/lib/postgresql/data

volumes:
  kejai_postgres_data:
